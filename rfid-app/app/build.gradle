plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// Configuração central do app: rfid-app/config.json
def cfg = new groovy.json.JsonSlurper().parse(rootProject.file('config.json'))

android {
    // namespace = pacote do código-fonte (R, BuildConfig); não confundir com applicationId
    namespace 'com.smartx.xscan'
    compileSdk cfg.app.compileSdk

    defaultConfig {
        applicationId cfg.app.applicationId
        minSdk cfg.app.minSdk
        targetSdk cfg.app.targetSdk
        versionCode cfg.app.versionCode
        versionName cfg.app.versionName

        // Strings do app geradas a partir do config.json
        resValue 'string', 'app_name', cfg.app.title
        resValue 'string', 'webhook_service_title', cfg.service.name
        resValue 'string', 'webhook_service_text', cfg.service.text
        resValue 'string', 'webhook_channel_name', cfg.service.channelName

        buildConfigField 'String', 'WEBHOOK_CHANNEL_ID', "\"${cfg.service.channelId}\""
        buildConfigField 'String', 'EXPORT_FILE_PREFIX', "\"${cfg.app.exportFilePrefix}\""
        buildConfigField 'String', 'LIB_VERSION', "\"${cfg.library.version}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        // libserial_port.so pode vir de mais de um SDK dentro da lib; mantém o primeiro encontrado
        pickFirst 'lib/arm64-v8a/libserial_port.so'
        pickFirst 'lib/armeabi-v7a/libserial_port.so'
        pickFirst 'lib/x86/libserial_port.so'
        pickFirst 'lib/x86_64/libserial_port.so'
    }

}

dependencies {
    // --- Android / Material ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // --- DataStore ---
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // --- Room ---
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // --- Rede (Webhook) ---
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // --- Localização GPS ---
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // --- Lifecycle / ViewModel / Coroutines ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // --- Leitores RFID (drivers, SDKs de fabricantes, manager de tags) ---
    // library.source = local  -> composite build com ../smartx-rfid-android
    // library.source = remote -> GitHub Packages (versão: library.version)
    implementation "${cfg.library.groupId}:${cfg.library.artifactId}:${cfg.library.version}"
}

// -----------------------------------------------------------------------------
// Branding: copiar imagens a partir da pasta única `static/` para recursos
// gerados antes do build. Mantém apenas uma fonte dos assets.
// -----------------------------------------------------------------------------

// tarefa que copia os arquivos do diretório raiz/static para build/generated/res/branding
task copyBranding(type: Copy) {
    from "$rootDir/static"
    include 'smtx.png', 'smtx_w.png', 'logo.png'
    into "$buildDir/generated/res/branding/drawable"
}

// Garante que a cópia execute antes do build
preBuild.dependsOn copyBranding

android.applicationVariants.all { variant ->
    def genRes = file("$buildDir/generated/res/branding")
    // registra a pasta gerada como fonte de resources
    variant.registerGeneratedResFolders(files(genRes))
}
