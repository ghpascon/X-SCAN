plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// Configuração central do app: rfid-app/config.json
def cfg = new groovy.json.JsonSlurper().parse(rootProject.file('config.json'))

android {
    // namespace = pacote do código-fonte (R, BuildConfig); não confundir com applicationId
    namespace 'com.smartx.xscan'
    compileSdk cfg.app.compileSdk

    defaultConfig {
        applicationId cfg.app.applicationId
        minSdk cfg.app.minSdk
        targetSdk cfg.app.targetSdk
        versionCode cfg.app.versionCode
        versionName cfg.app.versionName

        // Strings do app geradas a partir do config.json
        resValue 'string', 'app_name', cfg.app.title
        resValue 'string', 'webhook_service_title', cfg.service.name
        resValue 'string', 'webhook_service_text', cfg.service.text
        resValue 'string', 'webhook_channel_name', cfg.service.channelName

        buildConfigField 'String', 'WEBHOOK_CHANNEL_ID', "\"${cfg.service.channelId}\""
        buildConfigField 'String', 'EXPORT_FILE_PREFIX', "\"${cfg.app.exportFilePrefix}\""
        buildConfigField 'String', 'LIB_VERSION', "\"${cfg.library.version}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        // libserial_port.so pode vir de mais de um SDK dentro da lib; mantém o primeiro encontrado
        pickFirst 'lib/arm64-v8a/libserial_port.so'
        pickFirst 'lib/armeabi-v7a/libserial_port.so'
        pickFirst 'lib/x86/libserial_port.so'
        pickFirst 'lib/x86_64/libserial_port.so'
    }

}

dependencies {
    // --- Android / Material ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // --- DataStore ---
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // --- Room ---
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // --- Rede (Webhook) ---
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // --- Localização GPS ---
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // --- Lifecycle / ViewModel / Coroutines ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // --- Leitores RFID (drivers, SDKs de fabricantes, manager de tags) ---
    // library.source = local  -> composite build com ../smartx-rfid-android
    // library.source = remote -> GitHub Packages (versão: library.version)
    implementation "${cfg.library.groupId}:${cfg.library.artifactId}:${cfg.library.version}"
}

// -----------------------------------------------------------------------------
// Branding configurável: os nomes dos arquivos são definidos em config.json;
// os recursos gerados mantêm nomes estáveis usados pelo layout e pelo launcher.
// -----------------------------------------------------------------------------

def brandingSourceDir = file("$rootDir/static").canonicalFile
def brandingAssets = [
        [source: cfg.app.headerLogo ?: 'smtx.png', target: 'header_branding.png'],
        [source: cfg.app.launcherIcon ?: 'logo.png', target: 'launcher_branding.png']
].collect { asset ->
    def source = new File(brandingSourceDir, asset.source).canonicalFile
    if (!source.toPath().startsWith(brandingSourceDir.toPath()) || !source.isFile() || !source.name.endsWith('.png')) {
        throw new GradleException("Ícone de branding inválido ou inexistente em rfid-app/static: ${asset.source} (use um PNG dentro de static)")
    }
    [source: source, target: asset.target]
}

def brandingResDir = file("$buildDir/generated/res/branding/drawable")
tasks.register('copyBranding') {
    inputs.files(brandingAssets.collect { it.source })
    outputs.files(brandingAssets.collect { new File(brandingResDir, it.target) })
    doLast {
        def headerAsset = brandingAssets[0]
        copy {
            from headerAsset.source
            into brandingResDir
            rename { headerAsset.target }
        }

        // Adaptive icons use a 108dp viewport with a 72dp safe zone. Normalize
        // each configured icon into that canvas, preserving its aspect ratio,
        // so replacing it with a differently sized PNG won't stretch or crop it.
        def iconAsset = brandingAssets[1]
        def sourceImage = javax.imageio.ImageIO.read(iconAsset.source)
        if (sourceImage == null) {
            throw new GradleException("Não foi possível ler o PNG do ícone: ${iconAsset.source}")
        }

        int left = sourceImage.width
        int top = sourceImage.height
        int right = -1
        int bottom = -1
        for (int y = 0; y < sourceImage.height; y++) {
            for (int x = 0; x < sourceImage.width; x++) {
                if ((sourceImage.getRGB(x, y) >>> 24) != 0) {
                    left = Math.min(left, x)
                    top = Math.min(top, y)
                    right = Math.max(right, x)
                    bottom = Math.max(bottom, y)
                }
            }
        }
        if (right < left || bottom < top) {
            throw new GradleException("O PNG do ícone está totalmente transparente: ${iconAsset.source}")
        }

        def iconCanvas = new java.awt.image.BufferedImage(108, 108, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = iconCanvas.createGraphics()
        try {
            graphics.setComposite(java.awt.AlphaComposite.Src)
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY)

            int contentWidth = right - left + 1
            int contentHeight = bottom - top + 1
            double scale = 72.0d / Math.max(contentWidth, contentHeight)
            int drawWidth = Math.max(1, (int) Math.round(contentWidth * scale))
            int drawHeight = Math.max(1, (int) Math.round(contentHeight * scale))
            int x = (108 - drawWidth) / 2
            int y = (108 - drawHeight) / 2
            graphics.drawImage(sourceImage,
                    x, y, x + drawWidth, y + drawHeight,
                    left, top, right + 1, bottom + 1, null)
        } finally {
            graphics.dispose()
        }

        if (!javax.imageio.ImageIO.write(iconCanvas, 'png', new File(brandingResDir, iconAsset.target))) {
            throw new GradleException("Não foi possível gerar o recurso do ícone: ${iconAsset.target}")
        }
    }
}

preBuild.dependsOn tasks.named('copyBranding')

android.applicationVariants.all { variant ->
    def genRes = file("$buildDir/generated/res/branding")
    // registra a pasta gerada como fonte de resources
    variant.registerGeneratedResFolders(files(genRes))
}
